<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文 N2 單字卡練習</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background: #fff5f5; min-height: 100vh; color: #333; }
  header { background: linear-gradient(135deg,#e05260,#f2718a); color: #fff; padding: 18px 12px; text-align: center; }
  header h1 { font-size: 1.4rem; }
  header p { font-size: .85rem; opacity: .85; margin-top: 4px; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin: 16px auto 8px; flex-wrap: wrap; }
  .tabs button { padding: 10px 18px; border: none; border-radius: 24px; font-size: .95rem; cursor: pointer; background: #ffdfe3; color: #d33; font-weight: bold; transition: .2s; }
  .tabs button.active { background: #e05260; color: #fff; }
  .panel { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  /* 左右箭頭 */
  .arrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 56px; height: 56px; border: none; border-radius: 50%; font-size: 1.6rem; cursor: pointer;
    background: #e05260; color: #fff; box-shadow: 0 4px 14px rgba(224,82,96,.4); transition: .2s; display: none; }
  .arrow:hover { background: #f2718a; transform: translateY(-50%) scale(1.1); }
  .arrow.left { left: 12px; }
  .arrow.right { right: 12px; }
  /* 單字卡 */
  .card-wrap { perspective: 1000px; margin: 18px auto; width: 100%; max-width: 420px; height: 260px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(224,82,96,.18); padding: 16px; }
  .front { background: #fff; }
  .back { background: #e05260; color: #fff; transform: rotateY(180deg); }
  .emoji { font-size: 3rem; line-height: 1; }
  .word { font-size: 2rem; font-weight: bold; color: #333; text-align: center; }
  .kana { font-size: 1.05rem; color: #e05260; }
  .zh { font-size: 1.5rem; font-weight: bold; text-align: center; }
  .hint { font-size: .8rem; color: #bbb; }
  .speak-row { display: flex; gap: 12px; }
  .speak-btn { border: none; background: #ffeef0; border-radius: 50%; width: 52px; height: 52px; font-size: 1.15rem; cursor: pointer; transition: .2s; }
  .speak-btn:hover { background: #ffdfe3; transform: scale(1.08); }
  .speak-btn.light { background: rgba(255,255,255,.25); }
  .speak-btn.sm { width: 38px; height: 38px; font-size: .9rem; }
  .nav { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .nav button { padding: 10px 20px; border: none; border-radius: 12px; background: #e05260; color: #fff; font-size: 1rem; cursor: pointer; }
  .nav button.ghost { background: #ffdfe3; color: #d33; }
  .counter { font-weight: bold; color: #666; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 12px; }
  .filter-row button { border: 1px solid #ffc2cb; background: #fff; color: #d33; border-radius: 8px; padding: 4px 8px; font-size: .9rem; cursor: pointer; min-width: 34px; }
  .filter-row button.active { background: #e05260; color: #fff; }
  /* 單字列表 */
  .list-tools { display: flex; gap: 10px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .list-tools input { padding: 9px 16px; border: 1px solid #ffc2cb; border-radius: 20px; font-size: 1rem; width: min(320px,80vw); outline: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; }
  .item { background: #fff; border-radius: 14px; padding: 12px 10px; text-align: center; box-shadow: 0 3px 10px rgba(224,82,96,.10); }
  .item .em { font-size: 1.9rem; }
  .item .wd { font-weight: bold; margin-top: 4px; word-break: break-word; }
  .item .kn { font-size: .8rem; color: #e05260; }
  .item .zw { font-size: .9rem; color: #555; margin-top: 2px; }
  .item button { margin-top: 6px; }
  /* 下載提示列 */
  #dlBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; display: none;
    align-items: center; justify-content: center; gap: 10px; padding: 14px 16px;
    background: #333; box-shadow: 0 -4px 16px rgba(0,0,0,.25); flex-wrap: wrap; }
  #dlBar a { color: #ffd54a; font-weight: bold; font-size: .95rem; word-break: break-all; }
  #dlBar .tip { color: #bbb; font-size: .8rem; width: 100%; text-align: center; }
  #dlBar button { border: none; background: #666; color: #fff; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; flex-shrink: 0; }
  /* 選擇題測驗 */
  .quiz-box { background: #fff; border-radius: 20px; padding: 28px 20px; box-shadow: 0 8px 24px rgba(224,82,96,.15); text-align: center; margin-top: 18px; max-width: 640px; margin-left: auto; margin-right: auto; }
  .quiz-q { font-size: 1.8rem; font-weight: bold; margin: 10px 0 4px; }
  .quiz-q-sub { color: #999; font-size: .95rem; margin-bottom: 18px; }
  .opts { display: grid; gap: 10px; margin: 6px 0 14px; }
  .opts button { padding: 13px 16px; border: 2px solid #ffc2cb; border-radius: 14px; background: #fff;
    font-size: 1.1rem; cursor: pointer; transition: .15s; }
  .opts button:hover { background: #fff5f5; }
  .opts button.ok { border-color: #1a9c4b; background: #e9f9ef; color: #1a9c4b; font-weight: bold; }
  .opts button.bad { border-color: #d33; background: #fdecec; color: #d33; }
  .opts button:disabled { cursor: default; opacity: .9; }
  .setup-label { font-weight: bold; margin: 14px 0 8px; color: #555; }
  .setup-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .setup-row button { padding: 8px 16px; border: 1px solid #ffc2cb; background: #fff; color: #d33; border-radius: 18px; font-size: .95rem; cursor: pointer; }
  .setup-row button.active { background: #e05260; color: #fff; }
  .quiz-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .quiz-actions button { padding: 10px 20px; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; background: #e05260; color: #fff; }
  .quiz-actions button.ghost { background: #ffdfe3; color: #d33; }
  .feedback { margin-top: 14px; font-size: 1.15rem; font-weight: bold; min-height: 1.6em; }
  .feedback.good { color: #1a9c4b; }
  .feedback.bad { color: #d33; }
  .score { margin-top: 6px; color: #666; }
  /* 學習歷程 */
  .hist-summary { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .stat-card { background: #fff; border-radius: 14px; padding: 14px 20px; text-align: center; box-shadow: 0 3px 10px rgba(224,82,96,.10); min-width: 110px; }
  .stat-card .num { font-size: 1.6rem; font-weight: bold; color: #e05260; }
  .stat-card .lbl { font-size: .8rem; color: #888; margin-top: 2px; }
  .hist-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .hist-actions button { padding: 9px 18px; border: none; border-radius: 12px; font-size: .95rem; cursor: pointer; background: #e05260; color: #fff; }
  .hist-actions button.ghost { background: #ffdfe3; color: #d33; }
  .hist-actions button.danger { background: #b03a3a; }
  .hist-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(224,82,96,.08); font-size: .88rem; }
  .hist-table th { background: #e05260; color: #fff; padding: 9px 6px; }
  .hist-table td { padding: 7px 6px; border-bottom: 1px solid #ffeef0; text-align: center; }
  .hist-table tr:nth-child(even) td { background: #fff8f8; }
  @media (max-width: 480px) { .word { font-size: 1.6rem; } .emoji { font-size: 2.4rem; } .quiz-q { font-size: 1.4rem; } }
</style>
</head>
<body>
<header>
  <h1>🇯🇵 日文 N2 單字卡練習</h1>
  <p>TRY！日本語 N2 達陣 單字表 ｜ 點卡片翻面 ｜ 🔊 日文＋中文發音</p>
</header>
<div class="tabs">
  <button id="tabCard" class="active" onclick="switchMode('card')">🃏 單字卡</button>
  <button id="tabList" onclick="switchMode('list')">📋 單字列表</button>
  <button id="tabQuiz" onclick="switchMode('quiz')">✅ 選擇題測驗</button>
  <button id="tabHistory" onclick="switchMode('history')">📊 學習歷程</button>
</div>

<div id="dlBar"></div>

<button class="arrow left" id="arrowL" title="上一張" onclick="arrowNav(-1)">⬅</button>
<button class="arrow right" id="arrowR" title="下一張" onclick="arrowNav(1)">➡</button>

<!-- 單字卡模式 -->
<div class="panel" id="cardPanel">
  <div class="nav" style="margin-bottom:4px">
    <button class="ghost" onclick="shuffleCards()">🔀 洗牌</button>
    <button class="ghost" id="autoBtn" onclick="toggleAuto()">🔁 自動播放</button>
    <label style="font-size:.9rem;color:#666">⏱️</label>
    <select id="autoSec" style="padding:8px 10px;border-radius:12px;border:1px solid #ccd6ff;font-size:.95rem;background:#fff;cursor:pointer">
      <option value="1">間隔 1 秒</option><option value="2">間隔 2 秒</option><option value="3" selected>間隔 3 秒</option><option value="4">間隔 4 秒</option><option value="5">間隔 5 秒</option><option value="6">間隔 6 秒</option><option value="7">間隔 7 秒</option><option value="8">間隔 8 秒</option><option value="9">間隔 9 秒</option><option value="10">間隔 10 秒</option>
    </select>
    <label style="font-size:.9rem;color:#666">🗣️</label>
    <select id="rateSel" style="padding:8px 10px;border-radius:12px;border:1px solid #ccd6ff;font-size:.95rem;background:#fff;cursor:pointer">
      <option value="0.5">語速 0.5×</option><option value="0.6">0.6×</option><option value="0.7">0.7×</option><option value="0.8">0.8×</option><option value="0.85" selected>語速 0.85×（預設）</option><option value="0.9">0.9×</option><option value="1.0">1.0×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option><option value="1.4">1.4×</option><option value="1.6">1.6×</option>
    </select>
    <span class="counter" id="cardCounter"></span>
  </div>
  <div class="card-wrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="emoji" id="cardEmoji"></div>
        <div class="word" id="cardWord"></div>
        <div class="kana" id="cardKana"></div>
        <div class="speak-row">
          <button class="speak-btn" title="日文發音" onclick="event.stopPropagation();speakJa()">🔊 日</button>
          <button class="speak-btn" title="中文發音" onclick="event.stopPropagation();speakZh()">🔊 中</button>
        </div>
        <div class="hint">點卡片看中文意思</div>
      </div>
      <div class="face back">
        <div class="emoji" id="cardEmojiBack"></div>
        <div class="zh" id="cardZh"></div>
        <button class="speak-btn light" onclick="event.stopPropagation();speakZh()">🔊 中文發音</button>
        <div class="hint" style="color:rgba(255,255,255,.7)">再點一次回日文</div>
      </div>
    </div>
  </div>
  <div class="nav">
    <button class="ghost" onclick="prevCard()">⬅ 上一個</button>
    <button onclick="speakJa()">🔊 發音</button>
    <button class="ghost" onclick="nextCard()">下一個 ➡</button>
  </div>
  <div class="filter-row" id="letterFilter"></div>
</div>

<!-- 單字列表模式 -->
<div class="panel" id="listPanel" style="display:none">
  <div class="list-tools">
    <input id="searchBox" placeholder="🔍 搜尋日文或中文…" oninput="renderList()">
  </div>
  <div class="filter-row" id="listLetterFilter"></div>
  <div class="grid" id="wordGrid"></div>
</div>

<!-- 選擇題測驗模式 -->
<div class="panel" id="quizPanel" style="display:none">
  <div class="quiz-box" id="quizSetup">
    <div style="font-size:1.2rem;font-weight:bold;margin-bottom:14px">⚙️ 測驗設定</div>
    <div class="setup-label">題目方向</div>
    <div class="setup-row" id="dirRow">
      <button data-d="ja2zh" class="active">看日文 → 選中文</button>
      <button data-d="zh2ja">看中文 → 選日文</button>
      <button data-d="mix">混合</button>
    </div>
    <div class="setup-label">測驗題數</div>
    <div class="setup-row" id="countRow">
      <button data-c="10" class="active">10 題</button>
      <button data-c="20">20 題</button>
      <button data-c="30">30 題</button>
      <button data-c="all">全部</button>
    </div>
    <div class="setup-label">50 音範圍</div>
    <div class="setup-row" id="quizLetterRow"></div>
    <div style="margin-top:18px">
      <button style="padding:12px 40px;font-size:1.1rem" onclick="startQuiz()">🚀 開始測驗</button>
    </div>
    <div class="score" id="setupInfo" style="margin-top:12px"></div>
  </div>

  <div class="quiz-box" id="quizMain" style="display:none">
    <div class="quiz-q-sub" id="quizDir"></div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="opts" id="quizOpts"></div>
    <div class="quiz-actions">
      <button class="ghost" onclick="quizHint()">🔊 聽題目</button>
      <button class="ghost" onclick="nextQuiz()">下一題 ➡</button>
    </div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="score" id="quizScore"></div>
    <div style="margin-top:10px"><button class="ghost" onclick="backToSetup()" style="padding:8px 16px;font-size:.9rem;border:none;border-radius:10px;background:#ffdfe3;color:#d33;cursor:pointer">⚙️ 重新設定</button></div>
  </div>

  <div class="quiz-box" id="quizResult" style="display:none">
    <div style="font-size:3rem">🏁</div>
    <div style="font-size:1.4rem;font-weight:bold;margin:10px 0" id="resultText"></div>
    <div class="quiz-actions">
      <button onclick="startQuiz()">🔁 再測一次</button>
      <button class="ghost" onclick="backToSetup()">⚙️ 重新設定</button>
    </div>
  </div>
</div>

<!-- 學習歷程模式 -->
<div class="panel" id="historyPanel" style="display:none">
  <div class="hist-summary" id="histSummary"></div>
  <div class="hist-actions">
    <button onclick="downloadCSV()">⬇️ 下載 CSV</button>
    <button onclick="downloadTXT()">⬇️ 下載 TXT</button>
    <button class="danger" onclick="clearHistory()">🗑️ 清除紀錄</button>
  </div>
  <div style="overflow-x:auto">
    <table class="hist-table">
      <thead><tr><th>時間</th><th>類型</th><th>日文</th><th>中文</th><th>結果</th></tr></thead>
      <tbody id="histBody"></tbody>
    </table>
  </div>
</div>

// ===== 音效 =====
let audioCtx = null;
function tone(freq, t0, dur, vol=0.22, type='sine'){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime+t0); o.stop(audioCtx.currentTime+t0+dur+0.05);
}
function playSound(kind){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(kind==='good'){ tone(523.25,0,0.14); tone(659.25,0.12,0.14); tone(783.99,0.24,0.22); }
    else { tone(233.08,0,0.16,0.20,'square'); tone(185.00,0.15,0.22,0.20,'square'); tone(155.56,0.33,0.30,0.20,'square'); }
  }catch(e){}
}

// ===== 發音 =====
// 日文偏好溫暖女聲（依瀏覽器可用語音自動挑選）
const FEMALE_JA_HINTS = ['female','woman','google 日本語','kyoko','kyōko','otoya','kyouko','haruka','ayumi','mizuki','sakura','nanami','mei-jia','yui','nozomi','himari','aoi','siri female','りんご'];
function pickVoice(lang){
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.split('-')[0]));
  if(!vs.length) return null;
  if(lang.startsWith('ja')){
    const fem = vs.find(v => FEMALE_JA_HINTS.some(h => v.name.toLowerCase().includes(h)));
    if(fem) return fem;
  }
  return vs[0];
}
function speak(text, lang){
  if(!('speechSynthesis' in window)){ alert('此瀏覽器不支援語音功能'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith('zh') ? 0.85 : getRate();
  if(lang.startsWith('ja')) u.pitch = 1.1; // 稍微提高音調，聽起來更溫暖
  const v = pickVoice(lang);
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices(); }

function groupOf(w){
  let ch = w[1][0];
  if(/[ァ-ヶ]/.test(ch)) ch = String.fromCharCode(ch.charCodeAt(0)-0x60);
  return ch;
}

let deck = WORDS.map((w,i)=>i), ci = 0, flipped = false;
let autoMode = false, autoTimer = null;
function renderCard(){
  const [w,kana,zh,em] = WORDS[deck[ci]];
  document.getElementById('cardEmoji').textContent = em;
  document.getElementById('cardEmojiBack').textContent = em;
  document.getElementById('cardWord').textContent = w;
  document.getElementById('cardKana').textContent = kana===w ? '' : kana;
  document.getElementById('cardZh').textContent = zh;
  document.getElementById('cardCounter').textContent = (ci+1)+' / '+deck.length;
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  logEvent('單字卡', w, zh, '');
}
function flipCard(){ flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function nextCard(){ ci=(ci+1)%deck.length; renderCard(); if(autoMode){ clearAutoTimer(); autoSpeakCurrent(); } else { speakCardBoth(); } }
function prevCard(){ ci=(ci-1+deck.length)%deck.length; renderCard(); if(autoMode){ clearAutoTimer(); autoSpeakCurrent(); } else { speakCardBoth(); } }
function shuffleCards(){ clearAutoTimer(); speechSynthesis.cancel(); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} ci=0; renderCard(); if(autoMode) autoSpeakCurrent(); }
function speakJa(){ speak(WORDS[deck[ci]][0], 'ja-JP'); }
function speakZh(){ speak(WORDS[deck[ci]][2], 'zh-TW'); }
function speakCb(text, lang, cb){
  if(!('speechSynthesis' in window)){ cb&&cb(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith('zh') ? 0.85 : getRate();
  if(lang.startsWith('ja')) u.pitch = 1.1;
  const v = pickVoice(lang);
  if(v) u.voice = v;
  let done=false; const fin=()=>{ if(!done){done=true; cb&&cb();} };
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
  setTimeout(fin, Math.max(2500, text.length*300));
}

function speak2(text, lang, cb){
  // 自動播放：外文（英文/日文）連唸兩遍
  speakCb(text, lang, ()=>{ setTimeout(()=>speakCb(text, lang, cb), 350); });
}

function getRate(){
  const ids=['rateSel','sentRateSel'];
  for(const id of ids){ const el=document.getElementById(id); if(el && el.offsetParent!==null){ const v=parseFloat(el.value); if(v) return v; } }
  const el=document.getElementById('rateSel'); return el?(parseFloat(el.value)||0.85):0.85;
}
function getAutoSec(){ const el=document.getElementById('autoSec'); return el ? (parseInt(el.value)||3) : 3; }
function clearAutoTimer(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }
function toggleAuto(){
  autoMode = !autoMode;
  const b = document.getElementById('autoBtn');
  b.style.background = autoMode ? '#e05260' : '';
  b.style.color = autoMode ? '#fff' : '';
  clearAutoTimer();
  if(autoMode){ autoSpeakCurrent(); } else { speechSynthesis.cancel(); }
}
function autoSpeakCurrent(){
  if(!autoMode) return;
  const [w,,zh] = WORDS[deck[ci]];
  flipped=false; document.getElementById('card').classList.remove('flipped');
  speak2(w,'ja-JP',()=>{ autoTimer=setTimeout(()=>{
    if(!autoMode) return;
    flipped=true; document.getElementById('card').classList.add('flipped');
    speakCb(zh,'zh-TW',()=>{ autoTimer=setTimeout(()=>{
      if(!autoMode) return;
      ci=(ci+1)%deck.length; renderCard(); autoSpeakCurrent();
    }, getAutoSec()*1000); });
  }, 350); });
}
function speakCardBoth(){
  const [w,,zh] = WORDS[deck[ci]];
  speechSynthesis.cancel();
  speakCb(w,'ja-JP',()=>setTimeout(()=>speak(zh,'zh-TW'),250));
}

  });
})();
function poolSize(){ return quizLetter==='隨機' ? WORDS.length : WORDS.filter((w,i)=>groupOf(w)===quizLetter).length; }
function updateSetupInfo(){
  const n = quizCount==='all' ? poolSize() : Math.min(quizCount, poolSize());
  document.getElementById('setupInfo').textContent = '範圍：' + (quizLetter==='隨機'?'全部 50 音':quizLetter+' 行') + '（共 '+poolSize()+' 個單字）｜將出 '+n+' 題';
}
function startQuiz(){
  let pool = WORDS.map((w,i)=>i);
  if(quizLetter!=='隨機') pool = pool.filter(i=>groupOf(WORDS[i])===quizLetter);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const n = quizCount==='all' ? pool.length : Math.min(quizCount, pool.length);
  quizOrder = pool.slice(0,n); qi=0; qScore=0; qTotal=0;
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizMain').style.display='block';
  buildQuiz();
}
function backToSetup(){
  document.getElementById('quizSetup').style.display='block';
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizMain').style.display='none';
  updateSetupInfo();
}
function curDir(){
  if(quizDir==='mix') return Math.random()<0.5 ? 'ja2zh' : 'zh2ja';
  return quizDir;
}
function buildQuiz(){
  answered = false;
  const idx = quizOrder[qi], [w,kana,zh] = WORDS[idx];
  const dir = curDir();
  document.getElementById('quizDir').textContent = dir==='ja2zh' ? '🇯🇵 看日文 → 選出正確的中文意思' : '🇹🇼 看中文 → 選出正確的日文';
  document.getElementById('quizQ').textContent = dir==='ja2zh' ? w : zh;
  document.getElementById('quizQ').dataset.kana = kana;
  const fb0=document.getElementById('quizFeedback'); fb0.textContent=''; fb0.className='feedback';
  // 產生 4 個選項
  const pool = WORDS.map((x,i)=>i).filter(i=>i!==idx);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const opts=[idx, ...pool.slice(0,3)];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  const box=document.getElementById('quizOpts'); box.innerHTML='';
  opts.forEach(oi=>{
    const b=document.createElement('button');
    b.textContent = dir==='ja2zh' ? WORDS[oi][2] : WORDS[oi][0];
    b.onclick=()=>answerQuiz(b, oi===idx, idx, dir);
    box.appendChild(b);
  });
  updateScore();
  // 自動唸題目
  if(dir==='ja2zh') speak(w,'ja-JP'); else speak(zh,'zh-TW');
}
function answerQuiz(btn, correct, idx, dir){
  if(answered) return;
  answered = true;
  const [w,kana,zh] = WORDS[idx];
  document.querySelectorAll('#quizOpts button').forEach(b=>{
    b.disabled=true;
    const isAns = dir==='ja2zh' ? b.textContent===zh : b.textContent===w;
    if(isAns) b.classList.add('ok');
  });
  qTotal++;
  const fb=document.getElementById('quizFeedback');
  if(correct){
    qScore++; fb.textContent='🎉 答對了！'+w+'（'+kana+'）＝'+zh; fb.className='feedback good';
    playSound('good'); setTimeout(()=>speakRandom(PRAISE),600);
  } else {
    btn.classList.add('bad');
    fb.textContent='正確答案：'+w+'（'+kana+'）＝'+zh; fb.className='feedback bad';
    playSound('bad'); setTimeout(()=>speakRandom(CHEER),700);
  }
  logEvent('選擇題測驗', w, zh, correct?'✅ 答對':'❌ 答錯');
  updateScore();
}
function quizHint(){
  const dir = document.getElementById('quizDir').textContent.startsWith('🇯🇵');
  const [w,kana,zh] = WORDS[quizOrder[qi]];
  speak(dir?w:zh, dir?'ja-JP':'zh-TW');
}
function updateScore(){ document.getElementById('quizScore').textContent = '得分：'+qScore+' / '+qTotal+'　｜　第 '+(qi+1)+' 題 / 共 '+quizOrder.length+' 題'; }
function nextQuiz(){
  qi++;
  if(qi>=quizOrder.length){ showResult(); return; }
  buildQuiz();
}
function showResult(){
  document.getElementById('quizMain').style.display='none';
  document.getElementById('quizResult').style.display='block';
  const pct = quizOrder.length ? Math.round(qScore/quizOrder.length*100) : 0;
  let praise = pct>=90 ? '🌟 太厲害了！' : pct>=70 ? '👏 很棒！' : pct>=50 ? '💪 繼續加油！' : '📖 多多練習喔！';
  document.getElementById('resultText').innerHTML = '測驗結束！<br>得分：'+qScore+' / '+quizOrder.length+'（'+pct+' 分）<br>'+praise;
}

// ===== 學習歷程 =====
const HIST_KEY = 'n2History';
function getHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(-2000))); }catch(e){} }
function nowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function logEvent(type, word, zh, result){ const h=getHist(); h.push({t:nowStr(), type, word, zh, result}); saveHist(h); }
function renderHistory(){
  const h=getHist();
  const cardViews=h.filter(e=>e.type==='單字卡');
  const quiz=h.filter(e=>e.type==='選擇題測驗');
  const uniqWords=new Set(cardViews.map(e=>e.word)).size;
  const correct=quiz.filter(e=>e.result==='✅ 答對').length;
  const rate=quiz.length?Math.round(correct/quiz.length*100):0;
  document.getElementById('histSummary').innerHTML =
    '<div class="stat-card"><div class="num">'+cardViews.length+'</div><div class="lbl">看過單字（次）</div></div>'+
    '<div class="stat-card"><div class="num">'+uniqWords+'</div><div class="lbl">不重複單字（個）</div></div>'+
    '<div class="stat-card"><div class="num">'+quiz.length+'</div><div class="lbl">做過測驗（題）</div></div>'+
    '<div class="stat-card"><div class="num">'+rate+'%</div><div class="lbl">測驗答對率</div></div>';
  const body=document.getElementById('histBody'); body.innerHTML='';
  const recent=h.slice(-300).reverse();
  recent.forEach(e=>{
    const tr=document.createElement('tr');
    [e.t,e.type,e.word,e.zh,e.result||''].forEach(v=>{ const td=document.createElement('td'); td.textContent=v; tr.appendChild(td); });
    body.appendChild(tr);
  });
  if(!recent.length) body.innerHTML='<tr><td colspan="5" style="padding:30px;color:#999">尚無學習紀錄，快去看單字卡或做測驗吧！</td></tr>';
}
function histToRows(){ const h=getHist(); return [['時間','類型','日文','中文','結果'], ...h.map(e=>[e.t,e.type,e.word,e.zh,e.result||''])]; }
function downloadFile(content, filename, mime){
  let url, revoke=false;
  try{ const blob=new Blob([content],{type:mime}); url=URL.createObjectURL(blob); revoke=true; }
  catch(e){ url='data:'+mime+','+encodeURIComponent(content); }
  try{ const a=document.createElement('a'); a.href=url; a.download=filename; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); },3000); }catch(e){}
  const bar=document.getElementById('dlBar'); bar.innerHTML='';
  const link=document.createElement('a'); link.href=url; link.download=filename; link.textContent='📥 '+filename;
  const close=document.createElement('button'); close.textContent='✕';
  close.onclick=()=>{ bar.style.display='none'; if(revoke) URL.revokeObjectURL(url); };
  const tip=document.createElement('div'); tip.className='tip';
  tip.textContent='若未自動下載：點上方連結，或「長按連結 → 下載連結」即可儲存';
  bar.appendChild(link); bar.appendChild(close); bar.appendChild(tip);
  bar.style.display='flex';
  setTimeout(()=>{ if(bar.style.display==='flex' && revoke) URL.revokeObjectURL(url); },60000);
}
function downloadCSV(){
  const rows=histToRows();
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  downloadFile(csv, '學習歷程_'+nowStr().replace(/[: ]/g,'-')+'.csv', 'text/csv;charset=utf-8');
}
function downloadTXT(){
  const rows=histToRows();
  downloadFile(rows.map(r=>r.join(' | ')).join('\r\n'), '學習歷程_'+nowStr().replace(/[: ]/g,'-')+'.txt', 'text/plain;charset=utf-8');
}
function clearHistory(){ if(confirm('確定要清除所有學習紀錄嗎？此動作無法復原。')){ saveHist([]); renderHistory(); } }

function switchMode(m){
  ['card','list','quiz','history'].forEach(k=>{
    document.getElementById('tab'+k[0].toUpperCase()+k.slice(1)).classList.toggle('active',m===k);
    document.getElementById(k+'Panel').style.display = m===k?'block':'none';
  });
  document.getElementById('arrowL').style.display = m==='card'?'block':'none';
  document.getElementById('arrowR').style.display = m==='card'?'block':'none';
  if(m!=='card' && autoMode){ toggleAuto(); }
  if(m==='list') renderList();
  if(m==='history') renderHistory();
}
renderCard();
updateSetupInfo();
document.getElementById('arrowL').style.display='block';
document.getElementById('arrowR').style.display='block';
</script>
